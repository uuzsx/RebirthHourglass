name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon build runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: RebirthHourglass-NeoForge-26.1.1
          path: build/libs/*.jar
