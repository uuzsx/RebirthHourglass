plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = mod_group_id
base { archivesName = 'rebirth-hourglass-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'rebirth_hourglass'
        }
    }
    mods { rebirth_hourglass { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// GameTests are compiled for development, but neither their classes nor structures ship in the mod.
tasks.named('jar', Jar).configure {
    exclude 'com/xiaohunao/rebirthhourglass/gametest/**'
    exclude 'data/rebirth_hourglass/structure/test_empty.nbt'
}
